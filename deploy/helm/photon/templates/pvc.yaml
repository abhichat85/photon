{{- if .Values.persistence.enabled }}
# Durable home for the two SQLite files (telemetry + registry). D1 makes SQLite
# the audit truth for a single-replica gateway; an emptyDir would have thrown
# that truth away on every restart or reschedule, so the store the decision
# depends on is backed by a real volume.
#
# ReadWriteOnce is the correct access mode precisely because D1/D3 pin the
# gateway to one replica — and it is what forces the Deployment's Recreate
# strategy (see deployment.yaml). Both constraints lift together the day
# telemetry moves to Postgres.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
  labels:
    app: {{ .Release.Name }}
  annotations:
    # Keep the audit log even if the release is uninstalled — deleting a chart
    # should not destroy billing and promotion history.
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
{{- end }}
