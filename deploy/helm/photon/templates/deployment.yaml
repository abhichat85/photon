apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicas }}
  {{- if .Values.persistence.enabled }}
  # Recreate, not RollingUpdate: the data PVC is ReadWriteOnce, so a rolling
  # update would deadlock — the new pod cannot attach the volume the outgoing
  # pod still holds. Trading a few seconds of downtime for a rollout that
  # actually completes is correct at replicas: 1, where a rolling update buys
  # no availability anyway.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: photon
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 8080
          env:
            - name: PHOTON_CONFIG
              value: /etc/photon/fleet.yaml
            - name: PHOTON_DB
              value: /data/photon.db
            # Without this the registry falls back to a relative "registry.db",
            # landing in the image's WORKDIR (/app) — the container layer, which
            # does not survive a restart. Promotion history is the most
            # durability-critical state the gateway holds; it belongs on /data
            # next to the telemetry it is audited against.
            - name: PHOTON_REGISTRY_DB
              value: /data/registry.db
          volumeMounts:
            - name: config
              mountPath: /etc/photon
              readOnly: true
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet: {path: /v1/models, port: 8080}
            initialDelaySeconds: 3
          livenessProbe:
            httpGet: {path: /v1/models, port: 8080}
            initialDelaySeconds: 10
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: "1", memory: 512Mi}
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-config
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-data
          {{- else }}
          # Opt-out for ephemeral installs (CI, kind, throwaway demos) only.
          # Telemetry and registry are lost on every pod restart in this mode.
          emptyDir: {}
          {{- end }}
