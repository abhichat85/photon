image:
  repository: ghcr.io/einstein-labs/photon
  tag: "0.1.0"

# NOTE: telemetry is per-pod SQLite in v1 — run a single replica.
# Prometheus metrics aggregate fine across replicas; the SQLite audit DB
# does not. Postgres-backed telemetry is the named follow-on that unlocks
# replicas > 1.
replicas: 1

# Both SQLite files (telemetry + registry) live on this volume. Keep it
# enabled: DECISIONS.md D1 treats the telemetry row as the audit truth and the
# registry as the record of what reached production, and neither survives a
# restart without it. Disable only for throwaway installs where losing both is
# the point (CI, kind).
persistence:
  enabled: true
  size: 10Gi
  # Leave empty to use the cluster default StorageClass. Set explicitly on EKS
  # (e.g. gp3) — see deploy/EKS.md.
  storageClass: ""

config: |
  backends:
    - name: big
      base_url: http://vllm-big:8000/v1
      model: Qwen/Qwen2.5-14B-Instruct
      pricing:
        input_per_1m: 0.90
        output_per_1m: 0.90
  routing:
    default_backend: big
