groups:
  - name: photon-slo
    rules:
      - alert: PhotonGatewayDown
        expr: up{job="photon"} == 0
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "Photon gateway scrape target is down"
      - alert: PhotonHighErrorRate
        # 99.9% availability SLO → page when error rate exceeds 0.1% for 5m
        expr: |
          sum(rate(photon_requests_total{status="error"}[5m]))
            / clamp_min(sum(rate(photon_requests_total[5m])), 1e-9) > 0.001
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "Photon error rate above 0.1% (99.9% SLO burn)"
      - alert: PhotonLatencyP95High
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(photon_request_latency_seconds_bucket[10m]))) > 10
        for: 10m
        labels:
          severity: warn
        annotations:
          summary: "Photon upstream p95 latency above 10s"
  - name: photon-quality
    rules:
      - alert: PhotonGoldenQualityDrift
        # Model-quality drift: the periodic drift check (scripts/drift_check.py)
        # updates photon_golden_pass_rate. Sustained degradation below 0.95
        # means the served model regressed against the golden set.
        expr: photon_golden_pass_rate < 0.95
        for: 15m
        labels:
          severity: page
        annotations:
          summary: "Golden-set pass rate below 0.95 (model-quality drift)"
      - alert: PhotonGoldenCheckStale
        # The drift check hasn't reported in over an hour — the canary itself
        # is down, so quality is effectively unmonitored.
        expr: time() - max(photon_golden_pass_rate_created) > 3600
        for: 5m
        labels:
          severity: warn
        annotations:
          summary: "Golden drift check stale (no report in >1h)"
