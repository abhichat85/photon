apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-big
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-big
  template:
    metadata:
      labels:
        app: vllm-big
    spec:
      containers:
        - name: vllm
          image: vllm/vllm-openai:latest
          # To serve a quantized backend, add e.g. "--quantization", "awq" here
          # AND set the matching `quantization:` field on this backend in the
          # fleet config, then re-run the golden gate to confirm quality.
          args: ["--model", "Qwen/Qwen2.5-14B-Instruct", "--port", "8000"]
          ports:
            - containerPort: 8000
          resources:
            limits:
              nvidia.com/gpu: 1
          volumeMounts:
            - name: cache
              mountPath: /root/.cache/huggingface
      volumes:
        - name: cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-big
spec:
  selector:
    app: vllm-big
  ports:
    - port: 8000
      targetPort: 8000
