services:
  photon:
    build: ..
    ports:
      - "8080:8080"
    environment:
      PHOTON_CONFIG: /etc/photon/fleet.yaml
      PHOTON_DB: /data/photon.db
    volumes:
      - ../config/fleet.example.yaml:/etc/photon/fleet.yaml:ro
      - photon-data:/data
    depends_on:
      - vllm-big
      - vllm-small

  # GPU services — require NVIDIA Container Toolkit on the host.
  vllm-big:
    image: vllm/vllm-openai:latest
    command: ["--model", "Qwen/Qwen2.5-14B-Instruct", "--port", "8000"]
    ports:
      - "8000:8000"
    volumes:
      - hf-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  vllm-small:
    image: vllm/vllm-openai:latest
    # --quantization MUST match the `quantization:` field for this backend in
    # config/fleet.example.yaml. fp8 requires Hopper/Ada; drop the flag (and the
    # config field) to serve full precision on older GPUs.
    command: ["--model", "Qwen/Qwen2.5-1.5B-Instruct", "--port", "8001", "--quantization", "fp8"]
    ports:
      - "8001:8001"
    volumes:
      - hf-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"

volumes:
  photon-data:
  hf-cache:
