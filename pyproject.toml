[project]
name = "photon"
version = "0.1.0"
description = "Photon — Einstein Labs inference gateway (Phase 0: static routing, telemetry, shadow routing)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
core = [
    "scikit-learn>=1.4",
    "numpy>=1.26",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "scikit-learn>=1.4",
    "numpy>=1.26",
]
# Optional production observability. The code is a safe no-op without these
# (see photon/observability.py); install the extra AND set the matching env var
# to activate. Kept out of the base install to stay dependency-light in dev/test.
otel = [
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp>=1.25",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "opentelemetry-instrumentation-httpx>=0.46b0",
]
sentry = [
    "sentry-sdk>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["photon"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
